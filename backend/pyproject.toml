[project]
name = "ce-platform-backend-python"
version = "1.0.0"
description = "Enterprise Clean Architecture (DDD) Python Backend Service & Metrics Testbed"
authors = [{ name = "Mohammed-shihaf", email = "shihaf@Testable.Cloud" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "grpcio>=1.66.0",
    "pymongo>=4.9.0",
    "elasticsearch>=8.15.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "grpcio-tools>=1.66.0",
    "radon>=6.0.1",
    "bandit>=1.7.10",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term --cov-report=xml:coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
