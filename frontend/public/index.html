<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo_Stack — Python + JavaScript Client</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Demo_Stack Platform Testbed</h1>
    <p>Python FastAPI Backend + JavaScript SPA Client</p>
  </header>

  <main>
    <section class="card">
      <h2>Create Record</h2>
      <form id="record-form">
        <div class="form-group">
          <label for="title">Title:</label>
          <input type="text" id="title" required placeholder="Enter record title">
        </div>
        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" placeholder="Enter record description"></textarea>
        </div>
        <button type="submit" id="btn-submit">Submit Record</button>
      </form>
    </section>

    <section class="card">
      <h2>Records List</h2>
      <button id="btn-refresh">Refresh Records</button>
      <div id="records-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
